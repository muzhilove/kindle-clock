<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Kindle Voyage 准时版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#fff;color:#000;overflow:hidden;}
.page{position:fixed;width:100%;height:100%;}
.time{text-align:center;padding-top:110px;font-size:16rem;font-family:'Oswald',sans-serif;font-weight:700;cursor:pointer;}
.date-week {text-align:center;margin-top:30px;font-size:3rem;font-family:'Oswald',sans-serif;font-weight:bold;}
.info-main{text-align:center;margin-top:35px;font-size:4.5rem;font-family:'Oswald',sans-serif;font-weight:bold;}
.info-main.small{font-size:2.5rem;}
.info-sub{text-align:center;margin-top:18px;font-size:2.5rem;font-weight:bold;}

.adj-btn {
    position: fixed;
    bottom: 20px;
    width: 100px;
    height: 70px;
    border: 1px solid #000;
    border-radius: 8px;
    line-height: 70px;
    text-align: center;
    font-size: 1.5rem;
    color: #000;
    z-index: 100;
}
.btn-left { left: 20px; }   /* +1s */
.btn-right { right: 20px; } /* -1s */

#offsetTip {
    position: fixed;
    bottom: 95px;
    width: 100%;
    text-align: center;
    font-size: 1.5rem;
    color: #333;
    height: 1.5rem;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="page">
  <!-- 点击大时钟即可强制向网络校准时间 -->
  <div class="time" id="clock" onclick="resetOffset()">--:--</div>
  <div class="date-week" id="dateWeek">----年--月--日</div>
  <div class="info-main small" id="lunar">正在计算农历...</div>
  <div class="info-main" id="term">--</div>
  <div class="info-sub" id="weatherMain">正在获取天气...</div>
  <div class="info-sub" id="sun">--:--</div>
  
  <div id="offsetTip" onclick="resetOffset()"></div>

  <div class="adj-btn btn-left" onclick="adjustOffset(1)">+1s</div>
  <div class="adj-btn btn-right" onclick="adjustOffset(-1)">-1s</div>
</div>

<script>
function pad(n){return n<10?"0"+n:n;}
var lastMinute = -1;

var offsetSeconds = parseInt(localStorage.getItem('kindleOffset')) || 0; // 手动微调秒数
var autoNetworkOffset = parseInt(localStorage.getItem('kindleAutoNetOffset')) || 0; // 自动计算的网络时间偏差

/* 获取当前精确时间对象 */
function getCalculatedNow() {
    var now = new Date();
    // Kindle 浏览器时区兼容处理
    if(now.getTimezoneOffset() === 0) now.setHours(now.getHours() + 8);
    // 叠加网络时间误差 + 手动微调秒数
    now.setSeconds(now.getSeconds() + autoNetworkOffset + offsetSeconds);
    return now;
}

/* ===== 1. 本地农历算法 (纯离线运行) ===== */
var Lunar = {
    data: [0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6],
    mNames: ["正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","腊月"],
    dNames: ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"],
    animals: ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"],
    toLunar: function(y, m, d) {
        var offset = (Date.UTC(y, m - 1, d) - Date.UTC(2026, 1, 17)) / 86400000;
        if (offset < 0) {
            var preDays = ["廿四","廿五","廿六","廿七","廿八","廿九","三十","腊月初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿1","廿2","廿3","廿4","廿5","廿6","廿7","廿8","廿9"];
            var idx = 36 + Math.floor(offset); 
            return { y: 2026, m: (idx < 7 ? "冬月" : "腊月"), d: preDays[idx], a: "蛇" };
        }
        var i, leap = 0, temp = 0;
        for (i = 0; i < 31; i++) {
            temp = this.getYearDays(i);
            if (offset < temp) break;
            offset -= temp;
        }
        var year = 2026 + i;
        leap = this.getLeapMonth(i);
        var isLeap = false;
        for (i = 1; i < 13; i++) {
            if (leap > 0 && i == (leap + 1) && !isLeap) {
                --i; isLeap = true; temp = this.getLeapDays(year - 2026);
            } else {
                temp = this.getMonthDays(year - 2026, i);
            }
            if (isLeap && i == (leap + 1)) isLeap = false;
            if (offset < temp) break;
            offset -= temp;
        }
        return { y: year, m: (isLeap ? "闰" : "") + this.mNames[i - 1], d: this.dNames[Math.floor(offset)], a: this.animals[(year - 4) % 12] };
    },
    getLeapMonth: function(idx) { return this.data[idx] & 0xf; },
    getLeapDays: function(idx) { return (this.data[idx] & 0xf) ? ((this.data[idx] & 0x10000) ? 30 : 29) : 0; },
    getMonthDays: function(idx, m) { return (this.data[idx] & (0x10000 >> m)) ? 30 : 29; },
    getYearDays: function(idx) {
        var sum = 348;
        for (var i = 0x8000; i > 0x8; i >>= 1) sum += (this.data[idx] & i) ? 1 : 0;
        return sum + this.getLeapDays(idx);
    }
};

/* ===== 2. 本地节气算法 ===== */
var solarTerm=["小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至"];
var sTermInfo=[0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];
var funMessages = ["宜动","宜吃美食","宜喝茶","宜发呆","宜读书","宜听音乐","宜微笑","宜深呼吸","宜整理房间","宜感恩","宜晒太阳","宜散步","宜早睡","宜赏花","宜冥想","宜写作","宜远眺","宜泡脚","宜断舍离","宜练习书法","宜联系老友","宜看云","宜保持好奇","宜早起","宜伸个腰","宜小憩","宜听风","宜看场电影","宜添置绿植","宜保持耐心","宜认真吃饭","宜专注当下","宜奖励自己"];

function getSolarTermDate(y,n){ return new Date(31556925974.7*(y-1900)+sTermInfo[n]*60000+Date.UTC(1900,0,6,2,5)); }

/* ===== 3. 天气代码图标映射 ===== */
function parseWeatherCode(code) {
    if (code === 0) return { text: "晴", icon: "☀" };
    if (code >= 1 && code <= 3) return { text: "多云", icon: "☁" };
    if (code === 45 || code === 48) return { text: "雾", icon: "≡" };
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { text: "雨", icon: "☔" };
    if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return { text: "雪", icon: "❄" };
    if (code >= 95 && code <= 99) return { text: "雷阵雨", icon: "⚡" };
    return { text: "晴", icon: "☀" };
}

/* ===== 4. 本地公历/农历渲染 ===== */
function updateLocalDate(){
    var now = getCalculatedNow();

    var ty = now.getFullYear(), tm = now.getMonth() + 1, td = now.getDate();
    document.getElementById("dateWeek").innerHTML = ty + "年" + tm + "月" + td + "日 星期" + "日一二三四五六"[now.getDay()];
    
    var l = Lunar.toLunar(ty, tm, td);
    document.getElementById("lunar").innerHTML = "农历：" + l.y + "年（" + l.a + "）" + l.m + l.d;
    
    var txt = "";
    for(var i=0; i<24; i++){
        var st = getSolarTermDate(ty, i);
        if(td == st.getDate() && (tm - 1) == st.getMonth()) { txt = solarTerm[i]; break; }
    }
    if(!txt) txt = "今日 " + funMessages[(ty+tm+td) % funMessages.length];
    document.getElementById("term").innerHTML = txt;
}

/* ===== 5. 天气与网络时间双重校准请求 ===== */
function updateWeather(){
    var xhr = new XMLHttpRequest();
    var url = "https://api.open-meteo.com/v1/forecast?latitude=30.8936&longitude=120.0881&current_weather=true&daily=sunrise,sunset&timezone=Asia/Shanghai&t=" + new Date().getTime();
    
    xhr.open("GET", url, true);
    xhr.timeout = 10000;
    
    xhr.onreadystatechange = function(){
        if(xhr.readyState === 4){
            if(xhr.status === 200){
                // 核心功能：自动解析 HTTP 响应头中的标准 GMT 时间并计算设备误差
                try {
                    var serverDateHeader = xhr.getResponseHeader("Date");
                    if(serverDateHeader){
                        var serverTime = new Date(serverDateHeader).getTime();
                        var localTime = new Date().getTime();
                        if(!isNaN(serverTime)){
                            autoNetworkOffset = Math.round((serverTime - localTime) / 1000);
                            localStorage.setItem('kindleAutoNetOffset', autoNetworkOffset);
                            tick(); // 立即刷新页面时间显示
                        }
                    }
                } catch(e){}

                try {
                    var j = JSON.parse(xhr.responseText);
                    if(j && j.current_weather && j.daily){
                        var temp = j.current_weather.temperature;
                        var wCode = j.current_weather.weathercode;
                        var wInfo = parseWeatherCode(wCode);
                        
                        var sunrise = j.daily.sunrise[0] ? j.daily.sunrise[0].substr(11,5) : "--:--";
                        var sunset = j.daily.sunset[0] ? j.daily.sunset[0].substr(11,5) : "--:--";
                        
                        document.getElementById("weatherMain").innerHTML = "浙江·湖州  " + wInfo.icon + " " + wInfo.text + "  " + temp + "℃";
                        document.getElementById("sun").innerHTML = "☼↑ 日出 " + sunrise + "   ☼↓ 日落 " + sunset;
                    } else {
                        document.getElementById("weatherMain").innerHTML = "天气数据结构异常";
                    }
                } catch(e){
                    document.getElementById("weatherMain").innerHTML = "天气解析失败";
                }
            } else {
                document.getElementById("weatherMain").innerHTML = "天气获取失败(" + xhr.status + ")";
            }
        }
    };
    
    xhr.onerror = function(){
        document.getElementById("weatherMain").innerHTML = "天气网络连接受阻";
    };
    
    xhr.ontimeout = function(){
        document.getElementById("weatherMain").innerHTML = "天气获取超时";
    };

    xhr.send();
}

/* ===== 6. 总刷新函数 ===== */
function updateAllData(){
    updateLocalDate();
    updateWeather();
}

/* ===== 7. 核心时钟循环 ===== */
function tick(){
    var now = getCalculatedNow();

    var h = now.getHours(), m = now.getMinutes();
    document.getElementById("clock").innerHTML = pad(h) + ":" + pad(m);

    if(m !== lastMinute){
        document.getElementById("offsetTip").innerHTML = ""; 
        if(lastMinute !== -1) {
            if(m === 0) {
                window.location.href = window.location.pathname + "?t=" + new Date().getTime();
                return;
            }
            if(m % 5 === 0) updateAllData();
        }
        lastMinute = m;
    }
}

function adjustOffset(val) {
    offsetSeconds += val;
    localStorage.setItem('kindleOffset', offsetSeconds);
    tick(); 
    document.getElementById("offsetTip").innerHTML = "已微调: " + (offsetSeconds >=0 ? "+" : "") + offsetSeconds + "秒";
}

/* 点击一键向网络校准时间 */
function resetOffset() {
    offsetSeconds = 0;
    localStorage.setItem('kindleOffset', 0);
    document.getElementById("offsetTip").innerHTML = "正在向网络对齐标准时间...";
    updateWeather();
    setTimeout(function(){
        var diffText = (autoNetworkOffset >= 0 ? "+" : "") + autoNetworkOffset + "秒";
        document.getElementById("offsetTip").innerHTML = "已对齐网络标准时间 (设备偏离: " + diffText + ")";
        setTimeout(function(){ document.getElementById("offsetTip").innerHTML = ""; }, 4000);
    }, 1200);
}

// 初始化运行
updateAllData();
setInterval(tick, 2000);
tick();
</script>
</body>
</html>
